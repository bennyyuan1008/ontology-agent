[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ontology-agent"
version = "0.1.0"
description = "零售经营分析自然语言查询Agent（Ontology语义层）：对象模型驱动的 NL→SQL 语义查询底座"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pyyaml>=6.0",
    "python-oracledb>=4.0",
    "cryptography>=50.0",
    "cffi>=2.0",
]

[project.urls]
# Repository = "https://github.com/<your-name>/ontology-agent"

[tool.setuptools]
py-modules = [
    "query_engine",
    "metric_service",
    "monitor_service",
    "diagnosis_agent",
    "evidence_service",
    "decision_service",
    "agent_pipeline",
    "monitor_scheduler",
    "web_app",
    "quality_service",
    "run_agent",
    "run_eval",
    "gen_eval",
    "gen_blind",
]
