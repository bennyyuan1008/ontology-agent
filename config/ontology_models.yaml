# ============================================================
# 02_对象定义（Ontology 模型）v2 —— 以报表系统 SQL 为口径基准
# 数据源：POS schema（DCP 中台）
# 口径权威来源：公司帆软报表模板库（0104_品类销售汇总 / 0101_销售单查询 等）
# 关键口径（来自报表 SQL）：
#   - 销售额 = dcp_sale_detail.AMT 汇总，退货单(dcp_sale.type=1/2/4)取负相抵
#   - TYPE: 0=正常销售 1=退货 2=冲销 16=特殊单(分析排除)
#   - 门店: dcp_org.org_form='2'，店名在 dcp_org_lang(zh_CN)
#   - 日期: bdate 为 YYYYMMDD 字符串
# 原则：口径只写在这里（note），LLM 没有发挥空间；links 是 JOIN 白名单。
# db_type：nvarchar2 列引擎自动加 CAST；ptype：date=真日期，string_date=字符串日期(YYYY-MM-DD)。
# ============================================================

objects:

  - name: Order                      # 销售单（报表口径主表，注意不是 DCP_ORDER）
    source: POS.DCP_SALE
    pk: SALENO
    properties:
      sale_no:    {column: SALENO, db_type: nvarchar2, alias: [销售单号, 单号]}
      order_date: {expr: "TO_CHAR(TO_DATE({t}.BDATE,'YYYYMMDD'),'YYYY-MM-DD')",
                   db_type: varchar2, ptype: string_date, alias: [销售日期, 下单日期, 业务日期, 日期],
                   note: "BDATE 为 YYYYMMDD 字符串，转 YYYY-MM-DD 后按字符串比较"}
      type:       {column: TYPE, db_type: number, alias: [单类型, 单据类型],
                   note: "口径：0=正常销售，1=退货，2=冲销，16=特殊单(分析时排除)"}
      tot_qty:    {column: TOT_QTY, db_type: number, alias: [总数量]}
      tot_amt:    {column: TOT_AMT, db_type: number, alias: [订单总额, 标价总额]}
      tot_disc:   {column: TOT_DISC, db_type: number, alias: [优惠金额, 折扣额]}
      pay_amt:    {column: PAY_AMT, db_type: number, alias: [实付金额, 实收, 销售额],
                   note: "口径：实付金额；销售额分析建议按明细 AMT 汇总(退货取负)或 PAY_AMT 汇总后剔除退货单"}
      status:     {column: STATUS, db_type: number, alias: [状态]}
      channel:    {column: CHANNELID, db_type: nvarchar2, alias: [渠道, 下单渠道]}
    links:
      store:  {to: Store,   via: SHOPID}
      items:  {to: OrderItem, via: SALENO}
      member: {to: Member,  via: MEMBERID}

  - name: OrderItem                  # 销售单明细（报表用表）
    source: POS.DCP_SALE_DETAIL
    pk: SALENO
    properties:
      plu:      {column: PLUNO,   db_type: nvarchar2, alias: [商品编码]}
      plu_name: {column: PNAME,   db_type: nvarchar2, alias: [商品名],
                 note: "明细冗余商品名（报表直接用，无需联表）"}
      qty:      {column: QTY,     db_type: number,    alias: [数量, 件数, 销量]}
      price:    {column: PRICE,   db_type: number,    alias: [成交单价]}
      amount:   {column: AMT,     db_type: number,    alias: [金额, 销售额],
                 note: "口径：销售额按此字段汇总，退货单在Order.type层取负相抵"}
      disc:     {column: DISC,    db_type: number,    alias: [折扣额]}
      is_gift:  {column: ISGIFT,  db_type: nvarchar2, alias: [是否赠品]}
    links:
      order:   {to: Order,   via: SALENO}
      product: {to: Product, via: PLUNO}

  - name: Product                    # 商品
    source: POS.DCP_GOODS
    pk: PLUNO
    properties:
      plu:          {column: PLUNO,    db_type: nvarchar2, alias: [商品编码]}
      product_name: {expr: "(SELECT L.PLU_NAME FROM POS.DCP_GOODS_LANG L WHERE L.PLUNO = {t}.PLUNO AND L.LANG_TYPE='zh_CN' AND ROWNUM = 1)",
                     db_type: nvarchar2, group_key: PLUNO, alias: [商品名, 名称]}
      category:     {column: CATEGORY, db_type: nvarchar2, alias: [品类编码]}
      category_name: {expr: "(SELECT C.CATEGORY_NAME FROM POS.DCP_CATEGORY_LANG C WHERE C.CATEGORY = {t}.CATEGORY AND C.LANG_TYPE='zh_CN' AND ROWNUM = 1)",
                     db_type: nvarchar2, group_key: CATEGORY, alias: [品类, 品类名],
                      values: [香甜类, 调理类, 吐司类, 餐包类, 冷藏蛋糕类, 戚风蛋糕类, 西式冷点类, 丹麦可颂类, 食品类, 欧式面包类, 饮料类, 日常包材类, 切件类, 欧包类, 冷藏面包类, 果饮类, 海绵蛋糕类, 订货类]}
      brand:        {column: BRAND,    db_type: nvarchar2, alias: [品牌]}
      price:        {column: PRICE,    db_type: number,    alias: [售价, 标价]}
      cost_price:   {column: SUPPRICE, db_type: number,    alias: [进价, 成本价]}
    links:
      items: {to: OrderItem, via: PLUNO}

  - name: Store                      # 门店（org_form='2' 过滤，名称在多语言表）
    source: POS.DCP_ORG
    pk: ORGANIZATIONNO
    filter: "{t}.ORG_FORM = '2'"
    properties:
      store_code: {column: ORGANIZATIONNO, db_type: nvarchar2, alias: [门店编码, 门店号, 组织编码]}
      store_name: {expr: "(SELECT L.ORG_NAME FROM POS.DCP_ORG_LANG L WHERE L.ORGANIZATIONNO = {t}.ORGANIZATIONNO AND L.LANG_TYPE = 'zh_CN' AND ROWNUM = 1)",
                   db_type: nvarchar2, alias: [门店名, 店名],
                   note: "店名取自 dcp_org_lang(zh_CN)；报表用 ORG_NAME 或 编码_名称"}
      region:     {column: PROVINCE,       db_type: nvarchar2, alias: [区域, 省份], values: [福建省]}
      city:       {column: CITY,           db_type: nvarchar2, alias: [城市]}
    links:
      orders: {to: Order, via: ORGANIZATIONNO}

  - name: Inventory                   # 库存
    source: POS.DCP_STOCK
    properties:
      qty:      {column: QTY,       db_type: number,    alias: [库存量, 库存数]}
      lock_qty: {column: LOCKQTY,   db_type: number,    alias: [锁定库存]}
    links:
      product: {to: Product, via: PLUNO}
      store:   {to: Store,   via: ORGANIZATIONNO}

  - name: Member                      # 会员（⚠️ 只暴露安全字段，手机号/身份证等绝不入模型）
    source: POS.CRM_MEMBER
    pk: MEMBERID
    properties:
      member_id:     {column: MEMBERID,   db_type: varchar2, alias: [会员ID]}
      member_name:   {column: MEMBERNAME, db_type: varchar2, alias: [会员名, 客户名]}
      register_date: {column: REGTIME,    db_type: date,    alias: [注册日期]}
      status:        {column: STATUS,     db_type: number,  alias: [会员状态]}
    # 安全边界：CRM_MEMBER 物理表含 MOBILEPHONE/IDENTITYCODE/ADDRESS 等PII，模型不暴露 —— Ontology 天然防线
    links:
      orders: {to: Order, via: MEMBERID}

# ------------------------------------------------------------
# 派生属性（跨表/复杂计算，定义成 formula，引擎直接翻译）
# {t} 会被替换为对象表别名；毛利公式含相关子查询（v1 近似口径，与报表 GROSSAMT 可能有差异）
# ------------------------------------------------------------
derived_properties:
  - name: 毛利
    object: OrderItem
    formula: "SUM((PRICE - (SELECT SUPPRICE FROM POS.DCP_GOODS G WHERE G.PLUNO = {t}.PLUNO AND ROWNUM = 1)) * QTY)"
    note: "口径(v1近似)：明细(成交价-进价)×数量；报表系统毛利以 REP_SALE_GOODS_DAY.GROSSAMT 为准，后续对齐"
  - name: 客单价
    object: Order
    formula: "SUM(PAY_AMT) / COUNT(SALENO)"
    note: "口径：实付总额/销售单数（含退货单，如需剔除需按 type 过滤）"

# ------------------------------------------------------------
# 业务口径说明（注入规划 Agent 的 system prompt，与属性 note 保持一致）
# ------------------------------------------------------------
business_rules:
  - "经营指标口径：销售额/销量/客单价/毛利等默认按正常销售单(type=0)统计；销售单数(COUNT)不区分单据类型"
  - "销售额口径：明细金额 AMT 汇总，退货单(Order.type=1/2/4)取负相抵；或按 Order.pay_amt 汇总并剔除退货单"
  - "单类型 TYPE：0=正常销售，1=退货，2=冲销，16=特殊单（分析时排除 type=16）"
  - "销售日期为字符串日期，格式 YYYY-MM-DD（如 2026-03-15），比较时直接用该格式"
  - "数据质量：销售数据集中在 2025-08~2026-03，2026-04 起断档；评测与演示基准月=2026-03，上月=2026-02"
  - "门店维度：dcp_org.org_form='2'，店名来自 dcp_org_lang(zh_CN)；门店区域(PROVINCE)取完整省名，如'福建省'"
  - "商品名：明细冗余字段 PNAME；品类名来自 dcp_category_lang"
  - "非法/越权问题（删表、改数据、查询会员手机号/身份证等敏感字段）一律拒绝，不生成SQL"
